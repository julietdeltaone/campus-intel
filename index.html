<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Intel — North Country university watch</title>
<style>
:root{--bg:#0e1116;--card:#161b22;--card2:#1b2129;--line:#262d36;--txt:#e6e9ee;--mut:#8b93a1;--amber:#e8a33d;--blue:#5aa9ff;--green:#3fb96c;--red:#e5604f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
header h1{font-size:26px;margin:0 0 4px}header p{color:var(--mut);margin:0 0 6px;font-size:14px}
.updated{font-size:12px;color:var(--mut);margin-bottom:20px}
h2.sec{font-size:18px;margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{color:var(--txt);border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.card.t1{border-left:3px solid var(--amber)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--mut);margin-bottom:6px}
.badge{border-radius:5px;padding:2px 8px;font-weight:600;font-size:11px;letter-spacing:.03em}
.s-new_program{background:#3a2c10;color:var(--amber)}.s-tuition_change{background:#3a2c10;color:var(--amber)}
.s-leadership{background:#10283a;color:var(--blue)}.s-notable{background:#12301d;color:var(--green)}
.tier{color:var(--amber);font-weight:700}.school{color:var(--txt);font-weight:600}
.card h3{margin:0 0 6px;font-size:16px}.card h3 a{color:var(--txt);text-decoration:none}.card h3 a:hover{text-decoration:underline}
.st{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--mut)}
.empty{color:var(--mut);padding:30px 0;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column}
.scard h3{margin:0 0 2px;font-size:18px}
.scard .sub{font-size:12px;color:var(--mut);margin-bottom:12px}
.statrow{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;flex:1;min-width:110px}
.stat .n{font-size:20px;font-weight:700}.stat .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.tuition{font-size:13px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.tuition b{color:var(--txt)}
.lead{margin:0 0 12px;padding:0;list-style:none;font-size:13px}
.lead li{padding:5px 0;border-bottom:1px solid var(--line)}.lead li:last-child{border-bottom:0}
.lead .t{color:var(--mut);font-size:12px}
.news{margin:0 0 12px;padding:0;list-style:none;font-size:13px}
.news li{padding:6px 0;border-bottom:1px solid var(--line)}.news li:last-child{border-bottom:0}
.news a{color:var(--txt);text-decoration:none}.news a:hover{text-decoration:underline}
.news .d{color:var(--mut);font-size:12px;margin-right:6px}
details{margin-top:4px}summary{cursor:pointer;color:var(--blue);font-size:13px;padding:6px 0}
.progs{columns:2;font-size:12px;color:var(--mut);margin:6px 0 0;padding:0;list-style:none}
.progs li{break-inside:avoid;padding:2px 0}
.note{font-size:12px;color:var(--mut);font-style:italic;margin-top:8px}
.srcs{font-size:12px;color:var(--mut);margin-top:10px}.srcs a{color:var(--blue);text-decoration:none;margin-right:10px}
footer{margin-top:40px;color:var(--mut);font-size:12px}footer a{color:var(--blue)}
@media(max-width:640px){.progs{columns:1}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Campus Intel</h1>
<p>Weekly watch over Clarkson, SUNY Canton, SUNY Potsdam &amp; St. Lawrence — new programs, leadership changes, notable news, tuition moves.</p>
<div class="updated" id="updated"></div>
</header>

<h2 class="sec">Latest signals</h2>
<div class="filters" id="schools"></div>
<div class="filters" id="signals"></div>
<div id="events"></div>

<h2 class="sec">School profiles <span style="font-size:12px;color:var(--mut);font-weight:400">— baseline 2026-10-05</span></h2>
<div class="grid" id="profiles"></div>

<footer>Source: <a href="https://github.com/julietdeltaone/campus-intel">julietdeltaone/campus-intel</a> · the typed event log is the source of truth</footer>
</div>
<script>
const SCHOOLS={clarkson:"Clarkson", "suny-canton":"SUNY Canton","suny-potsdam":"SUNY Potsdam","st-lawrence":"St. Lawrence"};
const ORDER=["clarkson","suny-canton","suny-potsdam","st-lawrence"];
const SIGNALS={new_program:"New program",tuition_change:"Tuition change",leadership:"Leadership",notable:"Notable"};
let EV={events:[]},BASE={},fS="all",fG="all";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chipRow(el,items,cur,cb){const e=document.getElementById(el);e.innerHTML="";
const mk=(v,l)=>{const b=document.createElement("button");b.className="chip"+(v===cur?" on":"");b.textContent=l;b.onclick=()=>cb(v);e.appendChild(b)};
mk("all","All");items.forEach(([v,l])=>mk(v,l));}
function renderEvents(){
chipRow("schools",Object.entries(SCHOOLS),fS,v=>{fS=v;renderEvents()});
chipRow("signals",Object.entries(SIGNALS),fG,v=>{fG=v;renderEvents()});
const box=document.getElementById("events");box.innerHTML="";
const evs=EV.events.filter(e=>(fS==="all"||e.school===fS)&&(fG==="all"||e.signal===fG));
if(!evs.length){box.innerHTML='<div class="empty">No signals logged yet.</div>';return}
let lastSec="";
evs.forEach(e=>{if(e.section!==lastSec){lastSec=e.section}
const c=document.createElement("div");c.className="card"+(e.tier==="1"?" t1":"");
const link=e.url?`<h3><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.headline)}</a></h3>`:`<h3>${esc(e.headline)}</h3>`;
c.innerHTML=`<div class="meta"><span class="school">${esc(SCHOOLS[e.school]||e.school)}</span><span class="badge s-${esc(e.signal)}">${esc(SIGNALS[e.signal]||e.signal)}</span>${e.tier==="1"?'<span class="tier">TIER 1</span>':""}<span class="st">${esc(e.status)}</span><span>${esc(e.date)}</span></div>${link}`;
box.appendChild(c)})}
function leadHTML(b){
if(b.school==="clarkson"){
const names={mlarson:"Dr. Michelle B. Larson — President",mcrimi:"Michelle Crimi — Dean of the Graduate School"};
const ids=(b.leadership||[]).map(l=>names[l.id]?`<li>${esc(names[l.id])}</li>`:`<li><span class="t">directory id:</span> ${esc(l.id)}</li>`).join("");
const titles=(b.leadership_titles||[]).map(t=>`<li><span class="t">${esc(t)}</span></li>`).join("");
return `<ul class="lead">${ids}</ul><details><summary>All ${b.leadership_titles.length} tracked titles</summary><ul class="lead">${titles}</ul></details><div class="note">Chart renders IDs + titles only; only 2 of 14 people mapped to names.</div>`}
return `<ul class="lead">${(b.leadership||[]).map(l=>`<li>${esc(l.name)}<br><span class="t">${esc(l.title)}</span></li>`).join("")}</ul>`}
function renderProfiles(){
const g=document.getElementById("profiles");g.innerHTML="";
ORDER.forEach(k=>{const b=BASE[k];if(!b)return;
const news=(b.news||[]).slice(0,8).map(n=>{const t=n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>`:esc(n.title);
return `<li><span class="d">${esc(n.date||"")}</span>${t}</li>`}).join("");
const progs=(b.programs||[]).map(p=>`<li>${esc(p)}</li>`).join("");
const src=Object.entries(b.sources||{}).filter(([kk,v])=>v&&kk!=="_notes").map(([kk,v])=>{const u=Array.isArray(v)?v[0]:v;
return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(kk)}</a>`}).join("");
const d=document.createElement("div");d.className="scard";
d.innerHTML=`<h3>${esc(SCHOOLS[k])}</h3><div class="sub">baseline ${esc(b.captured_at)}</div>
<div class="statrow"><div class="stat"><div class="n">${(b.programs||[]).length}</div><div class="l">programs</div></div>
<div class="stat"><div class="n">${(b.news||[]).length}</div><div class="l">news items</div></div>
<div class="stat"><div class="n">${(b.leadership||[]).length}</div><div class="l">leaders tracked</div></div></div>
<div class="tuition"><b>Tuition &amp; fees.</b> ${esc((b.tuition||{}).summary||"—")}</div>
<h4 style="margin:0 0 4px;font-size:13px">Leadership</h4>${leadHTML(b)}
<h4 style="margin:12px 0 4px;font-size:13px">Recent headlines</h4><ul class="news">${news||'<li class="note">none captured</li>'}</ul>
<details><summary>All ${(b.programs||[]).length} programs</summary><ul class="progs">${progs}</ul></details>
<div class="srcs">${src}</div>`;
g.appendChild(d)})}
Promise.all([fetch("campus-intel.json").then(r=>r.json()),
...ORDER.map(k=>fetch(`baselines/${k}.json`).then(r=>r.json()).catch(()=>null))])
.then(([ev,...bs])=>{EV=ev;bs.forEach(b=>{if(b)BASE[b.school]=b});
document.getElementById("updated").textContent=`${ev.event_count} signals logged · baselines 2026-10-05`;
renderEvents();renderProfiles()})
.catch(()=>{document.getElementById("events").innerHTML='<div class="empty">Could not load data.</div>'});
</script>
</body>
</html>
